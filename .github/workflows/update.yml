name: Update Market Data

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      timeframes:
        description: "Comma-separated timeframes to update (4H,1D,1W)"
        required: false
        default: "1D,4H,1W"
        type: string
      since_days:
        description: "Number of days to backfill/upsert"
        required: false
        default: "30"
        type: string
      dry_run:
        description: "Run without writing to Supabase"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIMEFRAMES: ${{ inputs.timeframes || '1D,4H,1W' }}
          SINCE_DAYS: ${{ inputs.since_days || '30' }}
          DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          mkdir -p logs
          python -m market_data.run \
            --timeframes "$TIMEFRAMES" \
            --since-days "$SINCE_DAYS" \
            $DRY_RUN_FLAG 2>&1 | tee logs/pipeline.log

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: logs/pipeline.log
          retention-days: 14
